[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spotter-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "django-cors-headers>=4.7,<5", "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2", "gunicorn>=23,<24",
  "whitenoise>=6.12,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["config*", "planner*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
